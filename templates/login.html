{% extends "base.html" %}

{% block title %}Sign In - FreshMart Grocery{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-icon">🛒</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your FreshMart grocery account</p>
    </div>

    <div id="loginError" class="badge badge-out-of-stock" style="display: none; width: 100%; padding: 0.75rem; margin-bottom: 1.25rem; text-align: center; border-radius: var(--radius-md); font-size: 0.85rem;">
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have a grocery account?
      <a href="/register" style="font-weight: 700; color: var(--primary-dark);">Create one here</a>
    </div>

    <div style="text-align: center; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.85rem;">
      <a href="/admin/login" style="color: var(--text-muted);">Looking for the Store Admin Login?</a>
    </div>
  </div>
</div>
{% endblock %}
